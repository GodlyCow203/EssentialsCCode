name: Build & Release Plugin

on:
  push:
    branches:
      - "main"

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build everything
        run: ./gradlew build --refresh-dependencies

      - name: Get plugin version
        id: get_version
        run: |
          VERSION=$(./gradlew properties -q | awk '/^version:/ {print $2; exit}')
          echo "plugin_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected plugin version: $VERSION"

      - name: Collect JARs
        id: collect_jars
        run: |
          COMMIT_ID=${GITHUB_SHA::7}
          VERSION=${{ steps.get_version.outputs.plugin_version }}

          mkdir -p release

          MAIN_JAR=$(ls plugin/essc/build/libs/EssentialsC-*.jar | grep -vE "(sources|javadoc|plain)" | head -n1)
          echo "Main JAR: $MAIN_JAR"
          cp "$MAIN_JAR" release/EssentialsC-v${VERSION}-${COMMIT_ID}.jar

          EXPANSION_JAR=$(ls expansions/mysql/build/libs/MySQLDatabaseExpansion-*.jar | grep -vE "(sources|javadoc|plain)" | head -n1)
          echo "Expansion JAR: $EXPANSION_JAR"
          cp "$EXPANSION_JAR" release/EssentialsC-MySQL-Expansion-v${VERSION}-${COMMIT_ID}.jar

          echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT

      - name: Upload Plugin JARs
        uses: actions/upload-artifact@v4
        with:
          name: EssentialsC
          path: release/*.jar

      - name: Create GitHub Release and Upload JARs
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.plugin_version }}-${{ steps.collect_jars.outputs.commit_id }}
          name: EssentialsC v${{ steps.get_version.outputs.plugin_version }}-${{ steps.collect_jars.outputs.commit_id }}

          body: |
            Automatic release of EssentialsC

            Version: v${{ steps.get_version.outputs.plugin_version }}
            Commit: ${{ steps.collect_jars.outputs.commit_id }}

            Includes:
            - Main plugin
            - MySQL expansion

          files: release/*.jar
          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
